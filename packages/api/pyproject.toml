[project]
name = "vigilex-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vigilex-core",
    "vigilex-rag",
    "fastapi>=0.156",
    "uvicorn>=0.54",
    "jinja2>=3.1",
    "psycopg-pool>=3.3",
]

[tool.uv.sources]
vigilex-core = { workspace = true }
vigilex-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilex_api"]
