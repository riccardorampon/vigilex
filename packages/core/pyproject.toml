[project]
name = "vigilex-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]>=3.2", "pgvector>=0.5", "numpy>=2.0", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilex_core"]
