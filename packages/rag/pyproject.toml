[project]
name = "vigilex-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["vigilex-core", "pyarrow>=17"]

[project.scripts]
vigilex = "vigilex_rag.cli:main"

[tool.uv.sources]
vigilex-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigilex_rag"]
