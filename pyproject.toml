[project]
name = "vigilex"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["vigilex-core", "vigilex-rag"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
vigilex-core = { workspace = true }
vigilex-rag = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff==0.17.1", "pyright>=1.1.390", "pre-commit>=4.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["packages"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib"  # same test basenames in unit/ and integration/
